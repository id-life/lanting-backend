name: Deploy lanting-backend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service-ec2.yml
    with:
      service: lanting-backend
      ecr_repository: lanting-backend
      release_id: ${{ github.sha }}
      smoke_url: https://migration-lanting-api.id.life/healthz
